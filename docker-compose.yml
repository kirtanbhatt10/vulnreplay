# VulnReplay local lab. Start with:
#   VULNREPLAY_ADMIN_PASSWORD='choose-a-long-password' docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:8000/api/docs
#
# The demo applications run on an internal-only network: they have no published ports and no
# outbound internet access. Only the VulnReplay backend can reach them.

name: vulnreplay

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vulnreplay
      POSTGRES_USER: vulnreplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnreplay-local-db}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnreplay -d vulnreplay"]
      interval: 3s
      retries: 20
    networks: [app]

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      VULNREPLAY_ENVIRONMENT: ${VULNREPLAY_ENVIRONMENT:-development}
      VULNREPLAY_DATABASE_URL: postgresql+psycopg://vulnreplay:${POSTGRES_PASSWORD:-vulnreplay-local-db}@db:5432/vulnreplay
      VULNREPLAY_SECRET_KEY: ${VULNREPLAY_SECRET_KEY:-change-me-development-only-secret-key-000}
      VULNREPLAY_ADMIN_EMAIL: ${VULNREPLAY_ADMIN_EMAIL:-admin@vulnreplay.local}
      VULNREPLAY_ADMIN_PASSWORD: ${VULNREPLAY_ADMIN_PASSWORD:?Set VULNREPLAY_ADMIN_PASSWORD (min 10 chars)}
      VULNREPLAY_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      VULNREPLAY_ALLOWED_HOSTS: '["localhost","127.0.0.1","demo-vulnerable","demo-patched","demo-partial"]'
      VULNREPLAY_LLM_BASE_URL: ${VULNREPLAY_LLM_BASE_URL:-}
      # Synthetic lab credentials referenced by generated tests as {{secret:NAME}}.
      VULNREPLAY_SECRET_OWNER_USERNAME: alice
      VULNREPLAY_SECRET_OWNER_PASSWORD: alice-lab-password
      VULNREPLAY_SECRET_ATTACKER_USERNAME: bob
      VULNREPLAY_SECRET_ATTACKER_PASSWORD: bob-lab-password
      VULNREPLAY_SECRET_CAROL_PASSWORD: carol-lab-password
    ports:
      - "127.0.0.1:8000:8000"
    networks: [app, lab]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [app]

  demo-vulnerable:
    build: ./lab/demo_app
    environment: { DEMO_MODE: vulnerable }
    networks: [lab]

  demo-patched:
    build: ./lab/demo_app
    environment: { DEMO_MODE: patched }
    networks: [lab]

  demo-partial:
    build: ./lab/demo_app
    environment: { DEMO_MODE: partial }
    networks: [lab]

networks:
  app: {}
  lab:
    internal: true

volumes:
  dbdata: {}
