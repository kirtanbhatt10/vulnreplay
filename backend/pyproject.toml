[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreplay"
version = "0.1.0"
description = "Application security incident reproduction and vulnerability regression testing platform."

requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kirtan Bhatt" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "defusedxml>=0.7.1",
  "jinja2>=3.1.4",
  "fpdf2>=2.7.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7.9",
  "pip-audit>=2.7",
  "types-defusedxml",
]

[project.scripts]
vulnreplay = "vulnreplay.cli:main"

[tool.setuptools.packages.find]
include = ["vulnreplay*"]

[tool.setuptools.package-data]
vulnreplay = ["reports/templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
packages = ["vulnreplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", "migrations"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "PIL", "PIL.*", "fontTools.*"]
follow_imports = "skip"
